name: Laravel CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  laravel-tests:
    name: Build, Dependencies & Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup PHP Environment
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        extensions: mbstring, dom, fileinfo, curl, openssl, sqlite3, pdo_sqlite, bcmath, zip
        coverage: none

    - name: Copy Environment Configuration
      run: php -r "file_exists('.env') || copy('.env.example', '.env');"

    - name: Install Dependencies
      run: composer install --no-ansi --no-interaction --no-progress --prefer-dist --optimize-autoloader --ignore-platform-reqs

    - name: Generate Application Key
      run: php artisan key:generate

    - name: Set Directory & Database Permissions
      run: |
        chmod -R 777 storage bootstrap/cache
        mkdir -p database
        touch database/database.sqlite
        chmod -R 777 database

    - name: Run Database Migrations
      env:
        DB_CONNECTION: sqlite
        DB_DATABASE: database/database.sqlite
      run: php artisan migrate --force

    - name: Execute Automated Tests
      env:
        APP_ENV: testing
        APP_KEY: base64:8WcyT+Zp5MlGcMjCh0Py0ZqdQMP/DVDU4NVxcEI4EUA=
        SESSION_DRIVER: array
        CACHE_STORE: array
        DB_CONNECTION: sqlite
        DB_DATABASE: database/database.sqlite
      run: php artisan test
